<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><title>Cement Spec Thumbnail</title>
<style>
@font-face{font-family:"Anton";src:url("../assets/fonts/anton-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"JetBrains Mono";src:url("../assets/fonts/jetbrains-mono-latin-600-normal.woff2") format("woff2");font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#2a0a07}
#t{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,Arial,sans-serif;
  background:linear-gradient(180deg,rgba(30,6,3,.88) 0%,rgba(110,28,16,.62) 45%,rgba(30,6,3,.92) 100%),url("crack.jpg") center/cover}
.abs{position:absolute}
.glow{left:90px;top:900px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,110,70,.85),rgba(255,90,60,0) 66%)}
.person{left:-110px;top:960px;width:1300px;height:1083px;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 30px 50px rgba(0,0,0,.55))}
.h{font-family:Anton,Impact,sans-serif;line-height:.92;letter-spacing:.005em;text-transform:uppercase}
.capsule{position:absolute;width:170px;height:68px;border-radius:34px;background:linear-gradient(180deg,#ff7a5c,#ff4a2a);box-shadow:0 18px 26px rgba(255,90,60,.4),inset 0 -8px 12px rgba(160,30,10,.35)}
.spark{position:absolute;font-weight:300;color:#ff7a5c;line-height:1}
.chip{position:absolute;border-radius:99px;font-weight:900;color:#fff;white-space:nowrap}
</style></head><body>
<div id="t">

  <div class="abs h" style="left:56px;top:225px;font-size:310px;color:#fff;text-shadow:0 10px 0 rgba(0,0,0,.35)">GALAT</div>

  <i class="capsule" style="left:790px;top:120px;transform:rotate(24deg)"></i>
  <i class="capsule" style="left:-40px;top:1500px;transform:rotate(-22deg)"></i>
  <i class="capsule" style="left:880px;top:1380px;transform:rotate(30deg) scale(.8)"></i>
  <i class="spark" style="left:930px;top:1010px;font-size:90px">+</i>
  <i class="spark" style="left:40px;top:1160px;font-size:70px">+</i>
